spec: "1.1"
devices:
  e8257d:
    eom:
      TCPIP INSTR:
        q: "\r\n"
        r: "\n"
    error: ERROR
    dialogues:
      - q: "*IDN?"
        r: "Agilent Technologies,E8257D,US44440001,C.05.50"
      - q: "*CLS"
      - q: "*RST"
    properties:
      frequency:
        default: 1.0e9
        getter:
          q: ":FREQ?"
          r: "{:.6E}"
        setter:
          q: ":FREQ {:.6E}"
        specs:
          min: 250.0e3
          max: 67.0e9
          type: float
      power:
        default: -10.0
        getter:
          q: ":POW?"
          r: "{:.2f}"
        setter:
          q: ":POW {:.6E}"
        specs:
          min: -135.0
          max: 25.0
          type: float
      output_enabled:
        default: 0
        getter:
          q: ":OUTP?"
          r: "{:d}"
        setter:
          q: ":OUTP {:d}"
        specs:
          valid: [0, 1]
          type: int
resources:
  TCPIP0::sim-e8257d::inst0::INSTR:
    device: e8257d
